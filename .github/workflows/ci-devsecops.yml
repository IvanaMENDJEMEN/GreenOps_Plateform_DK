name: GreenOps DevSecOps Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # STAGE 1 : QUALITÉ DU CODE & TESTS
  # ==========================================
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'

      - name: Cache des dépendances npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Installation des dépendances (Auth Service)
        run: |
          cd auth_service
          npm ci

      # Tu pourras ajouter ici tes commandes de tests unitaires (ex: npm test) dès qu'ils seront prêts

  # ==========================================
  # STAGE 2 : SCANS DE SÉCURITÉ (DevSecOps)
  # ==========================================
  security-scan:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # 1. Scan de vulnérabilités dans le code source (SAST)
      - name: Scan du code source avec Trivy FS
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0' # Ne bloque pas la pipeline en local/test, mettre '1' pour bloquer en prod si faille

  # ==========================================
  # STAGE 3 : BUILD & IMAGE SECURITY SCAN
  # ==========================================
  build-and-secure-images:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Autorisation d'écrire dans GitHub Packages

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BUILD AUTOMATIQUE DU METRICS SERVICE ---
      - name: Build de l'image Docker (Metrics Service)
        run: |
          docker build -t ghcr.io/${{ github.repository }}/metrics-service:latest -f metrics_service/Dockerfile metrics_service/

      # 2. Scan de l'image Docker fraîchement construite avant de la push
      - name: Scan de l'image Docker avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/metrics-service:latest'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'

      - name: Push de l'image validée
        run: |
          docker push ghcr.io/${{ github.repository }}/metrics-service:latest